<VirtualHost *:${PORT}>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On

        # 1. Serve real files and directories directly (assets, images, etc.)
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # 2. Route PHP files in any sub-directory directly to PHP
        RewriteCond %{REQUEST_URI} \.php$ [NC]
        RewriteRule ^ - [L]

        # 3. Block SPA fallback for all backend paths
        RewriteCond %{REQUEST_URI} ^/(api|admin|pay|pg|jili|database|selfservice|tashangame|Tashanveu|jdb|jdbapi|jet|plugins|serive|manifest)(/|$) [NC]
        RewriteRule ^ - [L]

        # 4. SPA fallback ONLY for unknown frontend routes
        RewriteRule ^.*$ /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
